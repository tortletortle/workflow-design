# 漫画生成工作流配置 (全部使用Step模型)

# 分镜拆分
panels:
  count: 4
  language: zh

# 生图 (所有使用Step)
image:
  size: 1024x1024
  style_anchor: >
    black and white manga panel, clean ink linework, high contrast,
    dramatic shading, expressive characters
  extra: ''
  fallback_models:
    - step-2x-large
  consistency:
    enabled: true
    strength: 0.65

# 角色一致性
characters:
  lock: true

# 并发与重试
concurrency:
  design: 4
  image: 2
  retries: 2

# 拼接
assemble:
  caption_height: 64
  gap: 12
  background: '#ffffff'
  format: JPEG
  quality: 90

# 台词优化
polish:
  enabled: true
  max_chars: 24

# 质检
critic:
  prompt_qa: true
  image_qa: true
  vision_model: ''  # 留空禁用视觉质检，使用启发式质检

# 输出
output:
  dir: out
  comic_name: comic.png
