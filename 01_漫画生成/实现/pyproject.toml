[project]
name = "comic-generator"
version = "0.1.0"
description = "漫画生成工作流:文本 → 拆分分镜 → 每格提示词设计 → 生图 → 按顺序拼接成条漫"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pillow>=10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
